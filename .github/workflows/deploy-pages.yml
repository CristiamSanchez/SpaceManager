name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never deploy two runs at once; let the previous one finish.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/SpaceManager.Web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/SpaceManager.Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The site lives at /SpaceManager/, so the base href must match.
      # public/404.html is copied to the artifact root by the assets glob.
      - name: Build (production)
        run: npm run build -- --base-href /SpaceManager/

      # Angular outputs the site under the "browser" subfolder.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src/SpaceManager.Web/dist/SpaceManager.Web/browser

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
