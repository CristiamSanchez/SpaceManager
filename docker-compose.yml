services:
  postgres:
    image: postgres:17-alpine
    container_name: reservation-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: reservation_user
      POSTGRES_DB: reservation_db
      # Set POSTGRES_PASSWORD in a local .env file (not committed).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      # Host port 5432-5434 are occupied by unrelated local containers;
      # PostgreSQL keeps its standard 5432 inside the Docker network.
      - "5435:5432"
    volumes:
      - reservation-postgres-data:/var/lib/postgresql/data

volumes:
  reservation-postgres-data:
